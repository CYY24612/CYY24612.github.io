<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面不存在 | CYY</title>
    <meta name="robots" content="noindex">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #14161f;
            font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
            color: #f2f4fc;
            text-align: center;
            padding: 24px;
        }
        .code {
            font-size: clamp(4rem, 15vw, 7rem);
            font-weight: 800;
            letter-spacing: 0.05em;
            background: linear-gradient(135deg, #d4a017, #e6b82e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .msg { margin: 16px 0 32px; color: #9aa2bd; }
        a {
            display: inline-block;
            color: #d4a017;
            text-decoration: none;
            border: 1px solid rgba(212, 160, 23, 0.4);
            padding: 10px 28px;
            border-radius: 8px;
            transition: all 0.2s;
        }
        a:hover { background: rgba(212, 160, 23, 0.12); }
    </style>
</head>
<body>
    <div>
        <div class="code">404</div>
        <p class="msg">你访问的页面不存在或已被移动</p>
        <a href="/">返回首页</a>
    </div>
</body>
</html>
